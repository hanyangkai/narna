# VPS co-locate with 99x — bind localhost only; host nginx terminates TLS.
services:
  api:
    build:
      context: ../../..
      dockerfile: web/backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      UAP_DATABASE_URL: postgresql+psycopg2://uap:${POSTGRES_PASSWORD}@postgres:5432/uap_cloud
      UAP_REDIS_URL: redis://redis:6379/0
      UAP_CLOUD_CORS_ORIGIN: ${UAP_CLOUD_CORS_ORIGIN:-https://narna.org}
      UAP_TENANT_ROOT: /data/tenants
      UAP_ADQA_REQUIRE_AUTH: ${UAP_ADQA_REQUIRE_AUTH:-1}
      UAP_RATE_LIMIT_PER_MIN: ${UAP_RATE_LIMIT_PER_MIN:-120}
      UAP_BILLING_MODE: ${UAP_BILLING_MODE:-mock}
      UAP_CRYPTO_MODE: ${UAP_CRYPTO_MODE:-live}
      UAP_CRYPTO_RECEIVER_WALLET: ${UAP_CRYPTO_RECEIVER_WALLET:-0x24DAb37fd89222710ce1D5A4c4E81e26D51E34D5}
      UAP_CRYPTO_BOT_ENABLED: ${UAP_CRYPTO_BOT_ENABLED:-1}
      UAP_ETH_RPC_URL: ${UAP_ETH_RPC_URL:-}
      UAP_POLYGON_RPC_URL: ${UAP_POLYGON_RPC_URL:-}
      UAP_BASE_RPC_URL: ${UAP_BASE_RPC_URL:-}
      UAP_ARBITRUM_RPC_URL: ${UAP_ARBITRUM_RPC_URL:-}
      UAP_BSC_RPC_URL: ${UAP_BSC_RPC_URL:-}
      UAP_ROUTER_PROVIDER: ${UAP_ROUTER_PROVIDER:-mock}
      UAP_OPENROUTER_API_KEY: ${UAP_OPENROUTER_API_KEY:-}
      UAP_OPENAI_API_KEY: ${UAP_OPENAI_API_KEY:-}
      UAP_OLLAMA_BASE_URL: ${UAP_OLLAMA_BASE_URL:-}
      UAP_ROUTER_MODEL_CHEAP: ${UAP_ROUTER_MODEL_CHEAP:-}
      UAP_ROUTER_MODEL_REASON: ${UAP_ROUTER_MODEL_REASON:-}
      UAP_ROUTER_MODEL_CHALLENGE: ${UAP_ROUTER_MODEL_CHALLENGE:-}
      UAP_TELEGRAM_BOT_TOKEN: ${UAP_TELEGRAM_BOT_TOKEN:-}
      UAP_TELEGRAM_WEBHOOK_SECRET: ${UAP_TELEGRAM_WEBHOOK_SECRET:-}
      UAP_DISCORD_BOT_TOKEN: ${UAP_DISCORD_BOT_TOKEN:-}
      UAP_DISCORD_WEBHOOK_SECRET: ${UAP_DISCORD_WEBHOOK_SECRET:-}
      UAP_AGENT_JOBS_TICKER: ${UAP_AGENT_JOBS_TICKER:-1}
      UAP_AGENT_JOBS_TICK_SEC: ${UAP_AGENT_JOBS_TICK_SEC:-300}
      UAP_JOBS_TICK_SECRET: ${UAP_JOBS_TICK_SECRET:-}
    volumes:
      - narna_tenants:/data/tenants
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health', timeout=2).read()\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "127.0.0.1:8100:8000"

  web:
    build:
      context: ../../..
      dockerfile: web/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.narna.org}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8101:80"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: uap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: uap_cloud
    volumes:
      - narna_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uap -d uap_cloud"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:5435:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - narna_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:6381:6379"

volumes:
  narna_postgres_data:
  narna_redis_data:
  narna_tenants:
