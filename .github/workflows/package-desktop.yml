name: package-desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  zip-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build desktop scripts zip
        run: |
          bash scripts/package_desktop.sh
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: narna-desktop-scripts
          path: dist/narna-desktop.zip

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build portable exe
        shell: pwsh
        run: .\scripts\build_desktop_exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: NARNA-Desktop-windows
          path: dist/NARNA-Desktop-windows.zip

  release:
    needs: [zip-scripts, windows-exe]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: release-assets
      - name: List release assets
        run: find release-assets -type f -ls
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/narna-desktop.zip
            release-assets/NARNA-Desktop-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
