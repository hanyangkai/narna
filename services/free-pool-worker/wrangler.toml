name = "nana-free-pool"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Free plan: Workers + KV. Do NOT commit secrets — use `wrangler secret put`.
# Do NOT deploy from CI/agent — owner deploys after secrets + real KV ids.
[[kv_namespaces]]
binding = "LIMITS"
id = "00000000000000000000000000000000"
preview_id = "11111111111111111111111111111111"

[ai]
binding = "AI"

[vars]
# Non-secret defaults (override in dashboard if needed)
DAILY_MSG_LIMIT_PER_DEVICE = "10"
GLOBAL_DAILY_MSG_CAP = "5000"
MAX_TOKENS = "512"
WORKERS_AI_MODELS = "@cf/openai/gpt-oss-120b,@cf/openai/gpt-oss-20b,@cf/google/gemma-2-9b-it,@cf/meta/llama-3.1-8b-instruct,@cf/qwen/qwen1.5-7b-chat-awq"
OPENROUTER_FREE_MODELS = "openai/gpt-oss-20b:free,google/gemma-2-9b-it:free,meta-llama/llama-3.2-3b-instruct:free"
GROQ_MODEL = "openai/gpt-oss-20b"
# Configurable Gemini id (AI Studio free). Override if Google renames SKUs.
GEMINI_MODEL = "gemini-3.8-flash"
ZAI_MODEL = "glm-4.7-flash"
REQUIRE_DEVICE_CHECK = "0"
